name: Build Titanium Browser

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup depot_tools and Build
        run: |
          # 1. تثبيت أدوات البناء الأساسية
          sudo apt-get update
          sudo apt-get install -y git python3 curl lsb-release sudo
            
          # 2. استنساخ أدوات Chromium (depot_tools)
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PWD/depot_tools:$PATH"
          
          # 3. إعداد Git لتجنب أخطاء gclient
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 4. إعطاء صلاحية التنفيذ ومن ثم تشغيل سكريبت البناء الخاص بـ Titanium
          # ملاحظة: هذا السكريبت سيقوم بسحب كود Chromium (gclient sync) وبناء التطبيق
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: titanium-browser-apk
          path: "**/*.apk"
